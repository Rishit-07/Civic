mutation CreateUser @auth(level: USER) {
  user_insert(data: {
    id_expr: "auth.uid",
    email: "user@example.com",
    createdAt_expr: "request.time",
    displayName: "New User"
  })
}

mutation UpdateUser @auth(level: USER) {
  user_update(key: {id_expr: "auth.uid"}, data: {displayName: "Updated Name"})
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: {id_expr: "auth.uid"})
}

query GetUser @auth(level: USER) {
  user(key: {id_expr: "auth.uid"}) {
    email
    displayName
    createdAt
  }
}

query ListUsers @auth(level: PUBLIC, insecureReason: "Listing users is needed for a public directory.") {
  users {
    id
    displayName
  }
}

mutation CreateCategory @auth(level: USER) {
  category_insert(data: {name: "Tech", slug: "tech"})
}

mutation UpdateCategory @auth(level: USER) {
  category_update(id: "00000000-0000-0000-0000-000000000000", data: {name: "Technology"})
}

mutation DeleteCategory @auth(level: USER) {
  category_delete(id: "00000000-0000-0000-0000-000000000000")
}

query GetCategory @auth(level: PUBLIC, insecureReason: "Categories are public data.") {
  category(id: "00000000-0000-0000-0000-000000000000") {
    name
    slug
  }
}

query ListCategories @auth(level: PUBLIC, insecureReason: "Categories are public data.") {
  categories {
    name
    slug
  }
}

