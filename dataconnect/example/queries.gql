mutation CreateUserBookmark @auth(level: USER) {
  userBookmark_insert(data: {
    user: {id_expr: "auth.uid"},
    targetId: "00000000-0000-0000-0000-000000000000",
    targetType: "Workflow"
  })
}

mutation DeleteUserBookmark @auth(level: USER) {
  userBookmark_delete(id: "00000000-0000-0000-0000-000000000000")
}

query ListMyBookmarks @auth(level: USER) {
  userBookmarks(where: {userId: {eq_expr: "auth.uid"}}) {
    targetId
    targetType
  }
}