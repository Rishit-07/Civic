<script data-purpose="carousel-slide-logic">
  const slidesWrapper = document.getElementById('slidesWrapper');
  let currentSlide = 0;
  const totalSlides = 3;

  function goToSlide(index) {
    if (index >= 0 && index < totalSlides) {
      currentSlide = index;
      slidesWrapper.style.transform = `translateX(-${currentSlide * 390}px)`;
    }
  }

  // Touch swipe gesture support for mobile viewport
  let touchStartX = 0;
  let touchEndX = 0;

  slidesWrapper.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });

  slidesWrapper.addEventListener('touchend', (e) => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
  }, { passive: true });

  function handleSwipe() {
    const threshold = 40;
    if (touchEndX < touchStartX - threshold) {
      if (currentSlide < totalSlides - 1) {
        goToSlide(currentSlide + 1);
      }
    } else if (touchEndX > touchStartX + threshold) {
      if (currentSlide > 0) {
        goToSlide(currentSlide - 1);
      }
    }
  }

  // Skip to last slide
  document.getElementById('skipBtn').addEventListener('click', () => {
    goToSlide(totalSlides - 1);
  });

  // CTA Click feedback
  document.getElementById('ctaBtn').addEventListener('click', () => {
    const btn = document.getElementById('ctaBtn');
    btn.innerHTML = `<span class="text-xs font-bold tracking-widest text-[#FF5A00]">LAUNCHING NYAYASETU...</span>`;
    setTimeout(() => {
      btn.innerHTML = `<span class="text-xs font-black uppercase tracking-[0.18em]">GET STARTED</span>`;
    }, 1200);
  });
</script>
